[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltest"
version = "0.1.0"
description = "pytest for LLM prompts and skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "litellm>=1.40",
    "python-dotenv>=1.0",
]

[project.entry-points.pytest11]
skilltest = "skilltest.plugin"

[tool.setuptools.packages.find]
where = ["src"]
[tool.skilltest]
model = "ollama/qwen2.5:3b"
judge = "groq/openai/gpt-oss-120b"
fallbacks = ["groq/openai/gpt-oss-20b"]

[tool.pytest.ini_options]
testpaths = ["tests"]